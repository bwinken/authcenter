<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8">
        <title>AuthCenter 密碼重設連結</title>
    </head>
    <body style="margin:0; padding:24px; background:#f5f6f8; font-family:'Microsoft JhengHei','PingFang TC',Arial,sans-serif; color:#1f2328;">
        <div style="max-width:520px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px;">
            <h2 style="margin:0 0 20px; font-size:20px;">AuthCenter 密碼重設</h2>
            <p style="font-size:15px; line-height:1.7;">{{ employee_name }} 您好：</p>
            <p style="font-size:15px; line-height:1.7;">
                您剛剛申請重設 AuthCenter 密碼。請點擊下方按鈕設定新密碼。
            </p>
            <p style="margin:28px 0;">
                <a href="{{ link }}"
                   style="background:#10a37f; color:#ffffff; padding:12px 28px; border-radius:6px; text-decoration:none; display:inline-block; font-size:15px;">重設密碼</a>
            </p>
            <p style="font-size:13px; line-height:1.7; color:#57606a;">
                按鈕無法點擊時，請將以下網址複製到瀏覽器開啟：
                <br>
                <a href="{{ link }}" style="color:#10a37f; word-break:break-all;">{{ link }}</a>
            </p>
            <p style="font-size:13px; line-height:1.7; color:#57606a;">
                此連結 {{ expire_hours }} 小時內有效，設定新密碼後即失效。
                如果您沒有申請重設密碼，請忽略此信，您的密碼不會被變更。
            </p>
            <hr style="border:none; border-top:1px solid #d0d7de; margin:24px 0;">
            <p style="font-size:12px; color:#8c959f; margin:0;">此信由 AuthCenter 系統自動發送，請勿直接回覆。</p>
        </div>
    </body>
</html>
