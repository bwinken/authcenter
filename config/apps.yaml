# Registered AI Applications
# Each app must have: app_id, client_secret, redirect_uri, name
#
# client_secret should be a bcrypt hash in production.
# Use passlib: from passlib.hash import bcrypt; bcrypt.hash("your_secret")
#
# Access control (optional):
#   allowed_orgs: list of org_id strings, [] or omit = all organizations allowed
#   token_expire_hours: JWT token 有效時間（小時），預設 12

apps:
  - app_id: "ai_chat_app"
    client_secret: "$2b$12$dRPu5K776HmMkYCpT8QZmeTg4hFGusmgapab346WxC/F7AQVqBJsi"  # plaintext: chat_secret_123
    redirect_uri: "http://localhost:8001/auth/callback"
    name: "AI Chat Assistant"
    allowed_orgs: []       # all organizations
    token_expire_hours: 12

  - app_id: "ai_report_app"
    client_secret: "$2b$12$BF3diOavoQBJmSbXYHKCautM7rsx4mKpz2GLyUN0t7A3DGl5dOi7e"  # plaintext: report_secret_456
    redirect_uri: "http://localhost:8002/auth/callback"
    name: "AI Report Generator"
    allowed_orgs: ["IT", "FIN"]
    token_expire_hours: 12

  - app_id: "test_app"
    client_secret: "$2b$12$Y1H8HHMYH5Nq454XH82fLOHNjpi5xGfQ.uDjbSx.pxW1VMRWnA/56"  # plaintext: test_secret
    redirect_uri: "http://localhost:8001/callback"
    name: "Test Application"
    allowed_orgs: []
    token_expire_hours: 12
