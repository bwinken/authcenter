#
#     ssl_certificate     /etc/letsencrypt/live/sa-help.company.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/sa-help.company.com/privkey.pem;
#
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # ... (與上方 HTTP 設定相同的 location 區塊)
# }

