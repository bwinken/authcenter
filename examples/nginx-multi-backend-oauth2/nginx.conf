# ----- 前置需求：WebSocket Upgrade Map -----
# 請確認 /etc/nginx/nginx.conf 的 http {} 內已加入：
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# 否則 nginx -t 會報錯 unknown "connection_upgrade" variable
# ============================================================
# Nginx 反向代理設定 — 多後端 + OAuth2 Proxy (auth_request 模式)
# ============================================================
# 部署位置: /etc/nginx/sites-available/sa-help.company.com
# 啟用方式: ln -s /etc/nginx/sites-available/sa-help.company.com /etc/nginx/sites-enabled/
#
# 場景:
#   同一個 server_name 下掛載多個後端，共用 OAuth2 Proxy 認證：
#     /            → 前端應用
#     /fs/         → 檔案伺服器 (HFS 或其他 fileserver)
#
# 流量動線:
#   使用者 -> Nginx (:80/443)
#     ├── /oauth2/*          -> OAuth2 Proxy (127.0.0.1:4180) — 認證判斷
#     ├── /                  -> 前端應用 (127.0.0.1:3000)    — auth_request 保護
#     ├── /~/                -> HFS 內部資源 (127.0.0.1:8080) — API/前端/WebSocket
#     └── /fs/               -> HFS 檔案伺服器 (127.0.0.1:8080) — auth_request 保護
#
# 與 hfs-oauth2-proxy 範例的差異:
#   - hfs 範例: OAuth2 Proxy 作為反向代理，所有流量都經過它 (upstream 模式)
#   - 本範例:   Nginx 負責路由，OAuth2 Proxy 只負責認證判斷 (auth_request 模式)
#   - 好處: 可以一個 server_name + 一個 redirect_url 保護多個不同後端
# ============================================================

server {
    listen 80;
    server_name sa-help.company.com;

    # ----- HTTP → HTTPS 強制重導 -----
    # 正式環境務必啟用 HTTPS
    # return 301 https://$host$request_uri;

    # ==========================================
    #  OAuth2 Proxy 端點 (認證用，不直接服務內容)
    # ==========================================

    # OAuth2 Proxy 的認證/回呼/登出端點
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # auth_request 用的內部端點 — Nginx 在每個請求前先問 OAuth2 Proxy「這人有沒有登入？」
    # 回傳 202 = 已登入，401 = 未登入
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 不需要轉發 request body
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ==========================================
    #  前端應用 (/)
    # ==========================================
    location / {
        # ── 認證檢查 ──
        auth_request /oauth2/auth;

        # 未登入時，導向 OAuth2 Proxy 的登入頁面
        # rd 參數告訴 OAuth2 Proxy 登入後要回到哪裡
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        # 將 OAuth2 Proxy 回傳的使用者資訊注入 Header（可選）
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Auth-User         $auth_user;
        proxy_set_header X-Auth-Access-Token $auth_token;

        # ── 反向代理至前端 ──
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支援（如果前端需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ==========================================
    #  HFS 內部資源路徑（API、前端 JS/CSS、WebSocket）
    # ==========================================
    # HFS 的前端資源和 API 都在 /~/ 路徑下（如 /~/api/、/~/frontend/）。
    # 如果不加這個 location，透過 /fs/ 存取 HFS 時會卡在 Loading...。

    location /~/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ==========================================
    #  檔案伺服器 (/fs/)
    # ==========================================
    # 注意：HFS 不完全支援 sub-path 掛載。HFS 前端會用瀏覽器的 URL path
    # 來決定目前瀏覽的資料夾，所以 /fs/ 會被 HFS 解讀為資料夾路徑。
    # 如果遇到問題，建議改用以下方案：
    #   方案 A: 將 HFS 掛在 / （根路徑），其他後端用 sub-path
    #   方案 B: 給 HFS 獨立 subdomain（如 files.company.com）

    location /fs/ {
        # ── 認證檢查（同一個 OAuth2 Proxy）──
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Auth-User         $auth_user;
        proxy_set_header X-Auth-Access-Token $auth_token;

        # ── 反向代理至 HFS 檔案伺服器 ──
        # trailing slash 會 strip 掉 /fs/ 前綴，HFS 收到的是 /
        proxy_pass http://127.0.0.1:8080/;

        # 大檔案支援
        client_max_body_size 10G;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支援（HFS 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超時設定（大檔案傳輸需要較長時間）
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ----- HTTPS 範本（正式環境使用）-----
