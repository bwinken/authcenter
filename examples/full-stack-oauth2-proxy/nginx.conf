# ============================================================
# Nginx 反向代理設定 — 全端整合 (OAuth2 Proxy + 業務 API + HFS)
# ============================================================
# 部署位置: /etc/nginx/sites-available/sa-help.company.com
# 啟用方式: ln -s /etc/nginx/sites-available/sa-help.company.com /etc/nginx/sites-enabled/
#
# AuthCenter 獨立部署在 auth.company.com，不掛在這個 server_name 底下。
# OAuth2 Proxy 會自動跟 AuthCenter 溝通（OIDC flow）。
#
# 流量動線:
#   使用者 → Nginx (:80/443)
#     ├── /oauth2/*  → OAuth2 Proxy  (127.0.0.1:4180) — 認證判斷
#     ├── /api/*     → 業務 API      (127.0.0.1:8058) — 後端 API（需驗證 + 上傳）
#     ├── /fs/       → HFS           (127.0.0.1:8080) — 檔案伺服器（需驗證 + 大檔案）
#     └── /          → 前端靜態檔                       — 前端頁面（需驗證）
# ============================================================

server {
    listen 80;
    server_name sa-help.company.com;

    # ----- HTTP → HTTPS（正式環境啟用）-----
    # return 301 https://$host$request_uri;

    # ══════════════════════════════════════════
    #  OAuth2 Proxy 端點（認證用，不直接服務內容）
    # ══════════════════════════════════════════

    # OAuth2 Proxy 的登入/回呼/登出
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # auth_request 內部端點 — Nginx 每次請求前問 OAuth2 Proxy「有登入嗎？」
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 不轉發 request body
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ══════════════════════════════════════════
    #  業務 API 後端（需驗證 + 檔案上傳）
    # ══════════════════════════════════════════

    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        # 從 OAuth2 Proxy 取得 access_token，注入 Authorization header
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 檔案上傳支援
        client_max_body_size 50M;           # 上傳大小上限
        proxy_request_buffering off;        # 不在 Nginx 暫存，直接串流給後端
        proxy_read_timeout 300s;            # 大檔案等待時間

        # 路徑原樣轉發（不帶尾部 /）
        # /api/v1/documents/xxx → http://...:8058/api/v1/documents/xxx
        proxy_pass http://127.0.0.1:8058;
    }

    # ══════════════════════════════════════════
    #  HFS 檔案伺服器（需驗證 + 大檔案）
    # ══════════════════════════════════════════

    location /fs/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Auth-User         $auth_user;
        proxy_set_header X-Auth-Access-Token $auth_token;

        # 尾部 / 會 strip 掉 /fs/ 前綴
        # /fs/myfile.pdf → http://...:8080/myfile.pdf
        proxy_pass http://127.0.0.1:8080/;

        # 大檔案支援
        client_max_body_size 10G;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HFS 需要 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超時設定（大檔案需要較長時間）
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ══════════════════════════════════════════
    #  前端（兜底，需驗證）
    # ══════════════════════════════════════════

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        proxy_set_header X-Auth-User $auth_user;

        # ── 方案 A: Nginx 直接 serve 靜態檔 ──
        root /var/www/sa-help;
        index index.html;
        try_files $uri $uri/ /index.html;

        # ── 方案 B: 轉發至前端 dev server（開發時用）──
        # proxy_pass http://127.0.0.1:3000;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    # ── 靜態資源（可選：不走驗證，加速載入）──
    # location /assets/ {
    #     auth_request off;
    #     root /var/www/sa-help;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}

