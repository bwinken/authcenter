# ============================================================
# AuthCenter App 註冊範本 — sa-help (全端整合)
# ============================================================
# 將此區塊加入 AuthCenter 的 config/apps.yaml
#
# client_secret 產生方式:
#   python -c "from passlib.hash import bcrypt; print(bcrypt.using(rounds=12).hash('your-secret'))"
#
# 重要: redirect_uri 必須指向 OAuth2 Proxy 的 callback，不是後端的 callback
# ============================================================

apps:
  - app_id: "sa_help"
    name: "SA Help 系統"
    client_secret: "$2b$12$xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    redirect_uri: "http://sa-help.company.com/oauth2/callback"
    app_url: "http://sa-help.company.com"  # Dashboard「前往」按鈕的連結目標（OAuth2 Proxy 會自動處理認證）
    # allowed_orgs: ["IT", "RD"]    # 選填：限制特定組織
    # default_level: 1               # 選填：組織預設權限 (1=read, 2=read+write)
    # token_expire_hours: 24         # 選填：Token 有效時間
