# ============================================================
# Nginx 反向代理設定 — 檔案伺服器 (HFS + OAuth2 Proxy)
# ============================================================
# 部署位置: /etc/nginx/sites-available/files.company.com
# 啟用方式: ln -s /etc/nginx/sites-available/files.company.com /etc/nginx/sites-enabled/
#
# 流量動線:
#   使用者 -> Nginx (:80/443) -> OAuth2 Proxy (127.0.0.1:4180) -> HFS (Docker 內網)
# ============================================================

server {
    listen 80;
    server_name files.company.com;

    # ----- HTTP → HTTPS 強制重導 -----
    # 正式環境務必啟用 HTTPS，以下為 redirect 範本
    # return 301 https://$host$request_uri;

    # ----- 開發 / 內網環境直接 HTTP -----
    # 若不需要 HTTPS，可直接使用以下設定

    # 上傳檔案大小限制（依需求調整，HFS 預設無限制）
    client_max_body_size 10G;

    # 關閉 buffering，避免大檔案上傳/下載時 Nginx 暫存到磁碟
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        # ----- 反向代理至 OAuth2 Proxy -----
        proxy_pass http://127.0.0.1:4180;

        # 標準 Proxy Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket 支援（HFS 使用 WebSocket 做即時更新）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超時設定（大檔案傳輸需要較長時間）
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

